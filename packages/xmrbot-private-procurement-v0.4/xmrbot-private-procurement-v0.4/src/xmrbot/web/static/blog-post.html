<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="XMRBot source-linked Monero research."><title>XMRBot Blog</title><link rel="icon" href="/static/mark.svg"><link rel="stylesheet" href="/static/styles.css"></head><body><div id="nav"></div><div id="pagebar"></div><main><section class="section white"><div class="wrap blog-layout"><article class="article"><header class="article-header"><div class="eyebrow">XMRBot research note</div><h1 id="title">Loading…</h1><div class="article-dek" id="dek"></div><div class="article-meta" id="meta"></div></header><div class="prose" id="body"></div><section class="sources-box"><h3>Sources / provenance</h3><ol id="sources"></ol></section></article><aside><div class="sidebar-box"><h3>Machine-readable</h3><p id="raw-links"></p></div><div class="sidebar-box"><h3>Distribution</h3><p>This article can produce a source-preserving YouTube/Shorts/X/Instagram package through <code>xmr_content_from_blog</code>.</p><p id="recipe-link"></p></div></aside></div></section></main><div id="footer"></div><script src="/static/app.js"></script><script>(async()=>{XMR.mountShell('BLOG / POST');const slug=location.pathname.split('/').pop();try{const p=await XMR.api('/v1/blog/'+encodeURIComponent(slug));title.textContent=p.title;dek.textContent=p.dek;meta.textContent=`${XMR.fmtDate(p.published_at)} · ${p.author} · VERSION ${p.content_version}`;body.innerHTML=XMR.markdown(p.body_md);sources.innerHTML=(p.source_refs||[]).map(s=>`<li>${XMR.esc(s.name||s.title||s.url||'source')}${s.url?` — <a href="${XMR.esc(s.url)}" rel="noreferrer">${XMR.esc(s.url)}</a>`:''}</li>`).join('')||'<li>No source_refs were attached to this post.</li>';raw-links.innerHTML=`<a href="/v1/blog/${XMR.esc(slug)}/raw">Raw Markdown + sources</a><br><a href="/v1/blog/${XMR.esc(slug)}">JSON record</a>`;recipe-link.innerHTML=`<a href="/v1/content/from-blog/${XMR.esc(slug)}">Production package JSON</a>`;document.title=`${p.title} — XMRBot`;}catch(e){title.textContent='Post not found';dek.textContent='This article is not published or does not exist.';body.textContent='';sources.innerHTML='';}})();</script></body></html>
