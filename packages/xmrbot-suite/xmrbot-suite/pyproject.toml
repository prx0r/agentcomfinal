[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "xmrbot-suite"
version = "0.2.0"
description = "XMRBot: Monero intelligence, mining economics, MCP and local execution layer"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.8",
  "httpx>=0.27",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
xmrbot = "xmrbot.cli:app"
xmrbot-mcp = "xmrbot.mcp.stdio:main"
xmrbotd = "xmrbot.local.daemon:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
xmrbot = ["hardware/*.json", "knowledge/*.json", "web/static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
asyncio_mode = "auto"
