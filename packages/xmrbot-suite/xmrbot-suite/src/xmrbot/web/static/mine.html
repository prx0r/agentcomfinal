<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mine XMR — XMRBot</title><link rel="stylesheet" href="/static/styles.css"></head><body><div id="nav"></div><section class="hero" style="padding:52px 0 34px"><div class="wrap"><div class="eyebrow">RandomX economics</div><h1 style="font-size:58px">Mine, or buy?</h1><p>Price the machine like a tiny XMR-denominated business. No magic ROI: power, depreciation and difficulty are explicit.</p></div></section><section class="section" style="border-top:0"><div class="wrap"><div class="terminal-grid"><div class="panel"><div class="label">Mining profitability</div><div class="form-grid" style="margin-top:18px"><div class="field"><label>Hashrate (H/s)</label><input id="hashrate" type="number" value="26900"></div><div class="field"><label>Load watts</label><input id="watts" type="number" value="160"></div><div class="field"><label>Electricity $/kWh</label><input id="electricity" type="number" step="0.01" value="0.10"></div><div class="field"><label>Hardware cost $</label><input id="hardware" type="number" value="480"></div><div class="field"><label>Amortization months</label><input id="amort" type="number" value="36"></div><div class="field"><label>Pool fee %</label><input id="fee" type="number" step="0.1" value="0"></div></div><button class="btn primary" id="calc" style="margin-top:14px">Calculate</button><div class="result" id="profit-result">Enter your machine economics.</div></div><div class="panel"><div class="label">Mine vs buy</div><div class="form-grid" style="margin-top:18px"><div class="field"><label>Total budget $</label><input id="budget" type="number" value="800"></div><div class="field"><label>Months</label><input id="months" type="number" value="24"></div><div class="field"><label>Monthly difficulty growth %</label><input id="growth" type="number" step="0.1" value="1"></div><div class="field"><label>Residual hardware value %</label><input id="residual" type="number" value="30"></div></div><button class="btn" id="compare" style="margin-top:14px">Compare</button><div class="result" id="compare-result">Scenario comparison appears here.</div></div></div></div></section><div id="footer"></div><script src="/static/app.js"></script><script>nav.innerHTML=XMR.nav();footer.innerHTML=XMR.footer();async function p(){let body={hashrate_hs:+hashrate.value,watts:+watts.value,electricity_usd_kwh:+electricity.value,hardware_cost_usd:+hardware.value,amortization_months:+amort.value,pool_fee_pct:+fee.value};let r=await XMR.api('/v1/mining/profitability',{method:'POST',body:JSON.stringify(body)});document.querySelector('#profit-result').innerHTML=`<div class="big-result ${r.net_usd_day>=0?'good':'bad'}">${XMR.money(r.net_usd_day,2)}/day net</div><div class="sub">${XMR.xmr(r.expected_xmr_year,4)}/year · production cost ${r.effective_cost_per_xmr_usd?XMR.money(r.effective_cost_per_xmr_usd,0):'—'} / XMR · break-even ${r.break_even_xmr_price_usd?XMR.money(r.break_even_xmr_price_usd,0):'—'}</div>`}async function c(){let body={budget_usd:+budget.value,hardware_cost_usd:+hardware.value,hashrate_hs:+hashrate.value,watts:+watts.value,electricity_usd_kwh:+electricity.value,months:+months.value,monthly_difficulty_growth_pct:+growth.value,residual_value_pct:+residual.value};let r=await XMR.api('/v1/mining/mine-or-buy',{method:'POST',body:JSON.stringify(body)});document.querySelector('#compare-result').innerHTML=`<div class="big-result ${r.decision==='mine'?'good':'bad'}">${r.decision.toUpperCase()}</div><div class="sub">buy now: ${XMR.xmr(r.buy_xmr,4)} · mined: ${XMR.xmr(r.mine_xmr,4)} · value delta: ${XMR.money(r.delta_usd||0,2)}</div>`}calc.onclick=p;compare.onclick=c;p();c();</script></body></html>
